<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Dimensional Career Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #FAF5EC; --card: #FFFFFF;
  --text: #1E293B; --muted: #64748B;
  --blue: #2563EB; --sky: #0EA5E9; --green: #10B981; --amber: #F59E0B; --rose: #E11D48;
  --soft: #EFF6FF; --border: #E7E0D2; --navy: #0F172A;
}
html { scroll-behavior: smooth; }
body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; overflow-x: hidden; }

.bg-deco { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.bg-deco div { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.14; }
.bg-deco .b1 { width: 620px; height: 620px; background: #60A5FA; top: -18%; left: -12%; animation: drift 14s ease-in-out infinite alternate; }
.bg-deco .b2 { width: 520px; height: 520px; background: #34D399; bottom: -18%; right: -10%; animation: drift 18s ease-in-out infinite alternate-reverse; }
.bg-deco .b3 { width: 420px; height: 420px; background: #F5C98A; top: 40%; left: 55%; opacity: 0.12; animation: drift 16s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(50px,40px) scale(1.08); } }

main { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
.screen { display: none; }
.screen.active { display: block; animation: fadeUp .5s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

/* ============ WELCOME (glass on cream) ============ */
.glass { background: rgba(255,255,255,0.78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 20px 60px rgba(80,60,20,0.10); }
.form-card { border-radius: 24px; padding: 3rem; max-width: 660px; margin: 2.5rem auto; }
.form-card h1 { font-family: 'Lora', serif; font-size: 2.5rem; color: var(--navy); line-height: 1.2; margin-bottom: 0.4rem; }
.form-card h1 em { font-style: normal; background: linear-gradient(90deg, var(--blue), var(--sky), var(--green)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.accent-bar { width: 78px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--blue), var(--green)); margin: 0.6rem 0 1.1rem; }
.form-card p.sub { color: var(--muted); font-size: 1rem; margin-bottom: 1.4rem; }
.chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
.chip { background: var(--soft); color: var(--blue); border: 1px solid #BFDBFE; font-size: 0.75rem; font-weight: 600; padding: 0.35rem 0.85rem; border-radius: 999px; }
.form-group { margin-bottom: 1.3rem; }
.form-group label { display: block; margin-bottom: 0.4rem; color: #334155; font-size: 0.87rem; font-weight: 600; }
.form-group label::after { content: ' *'; color: var(--rose); }
.form-group input, .form-group select { width: 100%; padding: 0.9rem 1rem; background: rgba(255,255,255,0.9); border: 2px solid var(--border); border-radius: 12px; color: var(--navy); font-family: 'Poppins', sans-serif; font-size: 1rem; transition: 0.2s; }
.form-group input::placeholder { color: #A8A291; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37,99,235,0.13); background: #fff; }
.btn { display: inline-block; padding: 1rem 2.4rem; background: linear-gradient(90deg, var(--blue), var(--sky)); color: #fff; border: none; border-radius: 12px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.25s; margin-top: 1rem; box-shadow: 0 8px 22px rgba(37,99,235,0.35); }
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(37,99,235,0.45); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

/* ============ QUIZ (one at a time) ============ */
.quiz-wrap { max-width: 780px; margin: 0 auto; }
.quiz-top { display: flex; align-items: center; gap: 1rem; margin: 1rem 0 1.6rem; }
.ring-wrap { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
.ring-wrap svg { width: 76px; height: 76px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: #E7E0D2; stroke-width: 8; }
.ring-fill { fill: none; stroke: url(#ringGrad); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 326.7; transition: stroke-dashoffset 0.5s ease; }
.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; color: var(--navy); }
.quiz-meta { flex: 1; }
.quiz-meta .t { font-family: 'Lora', serif; font-weight: 700; font-size: 1.15rem; color: var(--navy); }
.quiz-meta .p { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
.stage-pill { background: var(--soft); color: var(--blue); font-size: 0.72rem; font-weight: 700; padding: 0.35rem 0.8rem; border-radius: 999px; border: 1px solid #BFDBFE; white-space: nowrap; }

.q-card-big { border-radius: 24px; padding: 2.2rem 2.4rem; }
.q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.q-sec { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--blue); background: var(--soft); border: 1px solid #BFDBFE; padding: 0.25rem 0.75rem; border-radius: 999px; }
.q-count { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.q-big { font-family: 'Lora', serif; font-size: 1.55rem; font-weight: 600; color: var(--navy); line-height: 1.4; margin-bottom: 1.6rem; }
.opts-list { display: flex; flex-direction: column; gap: 0.65rem; }
.opt-row { display: flex; align-items: center; gap: 0.9rem; width: 100%; text-align: left; padding: 0.95rem 1.1rem; background: #FDFBF7; border: 2px solid var(--border); border-radius: 14px; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; color: #475569; transition: 0.16s; }
.opt-row:hover { border-color: var(--blue); color: var(--blue); background: var(--soft); transform: translateX(6px); }
.opt-badge { width: 32px; height: 32px; border-radius: 50%; background: #EDE7DA; color: #475569; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; transition: 0.16s; }
.opt-row.selected { background: linear-gradient(90deg, var(--blue), var(--sky)); color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(37,99,235,0.35); }
.opt-row.selected .opt-badge { background: rgba(255,255,255,0.25); color: #fff; }
.kbd-hint { margin-top: 1.2rem; font-size: 0.78rem; color: #A8A291; text-align: center; }
.quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem; }
.ghost-btn { background: transparent; border: 2px solid var(--border); color: #475569; font-family: 'Poppins', sans-serif; font-weight: 600; padding: 0.7rem 1.5rem; border-radius: 12px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
.ghost-btn:hover { border-color: var(--blue); color: var(--blue); }

.done-card { border-radius: 24px; padding: 3rem 2.5rem; text-align: center; }
.done-emoji { font-size: 3.2rem; }
.done-card h2 { font-family: 'Lora', serif; font-size: 2rem; color: var(--navy); margin: 0.6rem 0 0.4rem; }
.done-card p { color: var(--muted); margin-bottom: 1rem; }

/* ============ REPORT ============ */
.report-container { background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(80,60,20,0.14); }
.report-page { background: #fff; padding: 4rem 5rem; min-height: 100vh; border-bottom: 1px solid #EDE7DA; }
.page-break { page-break-after: always; }
.cover-page { background: linear-gradient(160deg, #EFF6FF 0%, #FFFDF7 55%, #ECFDF5 100%); display: flex; flex-direction: column; justify-content: space-between; border-bottom: 6px solid var(--blue); }
.cover-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(15,23,42,0.12); padding-bottom: 1.3rem; }
.cover-logo { font-family: 'Lora', serif; font-size: 1.4rem; font-weight: 700; color: var(--blue); }
.cover-main h1 { font-family: 'Lora', serif; font-size: 3.3rem; line-height: 1.12; margin: 1.5rem 0 0.8rem; color: var(--navy); }
.cover-main > p { font-size: 1.1rem; color: #475569; max-width: 620px; }
.radar-box { position: relative; height: 340px; max-width: 560px; margin: 2rem auto; }
.cover-footer { background: #fff; padding: 1.8rem; border-radius: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; border: 1px solid var(--border); border-left: 5px solid var(--blue); box-shadow: 0 8px 24px rgba(80,60,20,0.08); }
.cover-footer div { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.cover-footer div span { display: block; color: var(--navy); font-size: 1.05rem; font-weight: 600; margin-top: 0.2rem; text-transform: none; letter-spacing: 0; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid #EDE7DA; padding-bottom: 1rem; }
.page-title { font-family: 'Lora', serif; font-size: 1.75rem; color: var(--navy); }
.page-num { font-size: 0.75rem; color: #A8A291; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.report-section h2 { font-family: 'Lora', serif; font-size: 1.3rem; color: var(--navy); margin: 1.8rem 0 1rem; border-left: 4px solid var(--blue); padding-left: 0.75rem; }
.report-section p { color: #374151; margin-bottom: 1rem; font-size: 0.95rem; line-height: 1.7; }
.report-section ul { list-style: none; margin: 1rem 0; }
.report-section ul li { position: relative; padding-left: 1.5rem; margin-bottom: 0.6rem; font-size: 0.95rem; color: #374151; }
.report-section ul li::before { content: '➤'; position: absolute; left: 0; color: var(--blue); font-size: 0.75rem; top: 4px; }
.summary-box { background: linear-gradient(135deg, #FAF7F0, #F1EDE2); border: 1px solid #E7E0D2; border-radius: 10px; padding: 1.4rem; }
.table-custom { width: 100%; border-collapse: collapse; margin: 1.4rem 0; font-size: 0.9rem; }
.table-custom th, .table-custom td { border: 1px solid #EDE7DA; padding: 0.75rem 1rem; text-align: left; vertical-align: top; }
.table-custom th { background: var(--navy); color: #fff; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.78rem; }
.table-custom tr:nth-child(even) { background: #FAF8F2; }
.table-custom td.cat { font-weight: 600; color: var(--navy); width: 25%; }
.level-badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; }
.l-high { background: rgba(16,185,129,0.12); color: #047857; border: 1px solid #047857; }
.l-med { background: rgba(245,158,11,0.12); color: #B45309; border: 1px solid #B45309; }
.l-low { background: rgba(225,29,72,0.10); color: #BE123C; border: 1px solid #BE123C; }
.bar-chart-box { background: #FAF8F2; padding: 1.4rem; border-radius: 10px; border: 1px solid #EDE7DA; }
.bar-item { margin-bottom: 1rem; }
.bar-label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 0.3rem; font-weight: 600; color: #334155; }
.bar-track { height: 10px; background: #EDE7DA; border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: 5px; transition: width 1.1s cubic-bezier(.22,1,.36,1); }
.fill-1 { background: linear-gradient(90deg, #1D4ED8, #3B82F6); }
.fill-2 { background: linear-gradient(90deg, #BE123C, #F43F5E); }
.fill-3 { background: linear-gradient(90deg, #B45309, #F59E0B); }
.fill-4 { background: linear-gradient(90deg, #047857, #10B981); }
.print-btn { background: linear-gradient(90deg, var(--blue), var(--sky)); color: #fff; border: none; padding: 1rem 2rem; border-radius: 12px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; font-size: 1rem; width: 100%; margin: 2rem 0 0; }
.print-btn:hover { opacity: 0.9; }
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .6s ease, transform .6s ease; }
.reveal.vis { opacity: 1; transform: none; }

@media (max-width: 768px) {
  .form-card { padding: 1.8rem; }
  .q-card-big { padding: 1.5rem; }
  .q-big { font-size: 1.25rem; }
  .report-page { padding: 2.2rem 1.4rem; }
  .cover-main h1 { font-size: 2.2rem; }
  .cover-footer { grid-template-columns: 1fr; }
  .stage-pill { display: none; }
}

/* ============ PRINT — A4 PERFECT ============ */
@page { size: A4; margin: 0; }
@media print {
  html, body { width: 210mm; background: #fff !important; line-height: 1.45; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .bg-deco, .print-btn, #form-screen, #quiz-screen { display: none !important; }
  main { max-width: none; padding: 0; margin: 0; }
  .report-container { box-shadow: none !important; border: none !important; border-radius: 0 !important; }

  .report-page {
    width: 210mm;
    min-height: 0 !important;
    padding: 14mm 16mm;
    page-break-after: always;
    break-after: page;
    box-shadow: none;
    border: none;
  }
  .report-page:last-child { page-break-after: auto; break-after: auto; }

  /* Cover flows naturally — no spill onto page 2 */
  .cover-page { height: auto !important; min-height: 0 !important; overflow: visible; padding: 14mm 16mm; }
  .cover-main h1 { font-size: 2.8rem !important; margin: 1rem 0 0.6rem; }
  .radar-box { height: 230px !important; max-width: 420px !important; margin: 0.8rem auto 1rem !important; }
  .cover-footer { padding: 1.2rem !important; gap: 0.8rem !important; page-break-inside: avoid; break-inside: avoid; }

  /* Tighter print typography = no near-empty pages */
  .page-header { margin-bottom: 1.1rem; padding-bottom: 0.5rem; }
  .report-section h2 { font-size: 1.12rem; margin: 1rem 0 0.6rem; }
  .report-section p { font-size: 0.85rem; margin-bottom: 0.45rem; }
  .report-section ul { margin: 0.5rem 0; }
  .report-section ul li { font-size: 0.85rem; margin-bottom: 0.3rem; padding-left: 1.2rem; }
  .bar-chart-box { padding: 0.9rem; }
  .bar-item { margin-bottom: 0.6rem; }
  .table-custom th, .table-custom td { padding: 0.5rem 0.7rem; font-size: 0.8rem; }
  .summary-box { padding: 1rem; }

  /* Never slice a row, bar, box, or heading across pages */
  h1, h2, .bar-item, .summary-box, .level-badge, .cover-footer, .table-custom tr {
    page-break-inside: avoid; break-inside: avoid;
  }
  .table-custom { page-break-inside: auto; break-inside: auto; }

  .reveal { opacity: 1 !important; transform: none !important; }
  .bar-fill, .pct-num { transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#10B981"/></linearGradient></defs></svg>
<div class="bg-deco"><div class="b1"></div><div class="b2"></div><div class="b3"></div></div>

<main>
<!-- WELCOME -->
<section id="form-screen" class="screen active">
  <div class="form-card glass">
    <h1>Multi-Dimensional <em>Test</em></h1>
    <div class="accent-bar"></div>
    <p class="sub">A dynamic psychometric evaluation that adapts to your academic stage — analyzing Personality, Interests, Career Motivators, Learning Styles, and Natural Abilities.</p>
    <div class="chips">
      <span class="chip">📝 60 Questions</span><span class="chip">⏱️ ~15 Minutes</span>
      <span class="chip">🎓 Grade-Specific</span><span class="chip">📊 Detailed Report</span>
    </div>
    <div class="form-group"><label>Student Name</label><input type="text" id="s-name" placeholder="e.g. Aarav Sharma"></div>
    <div class="form-group"><label>Email Address</label><input type="email" id="s-email" placeholder="you@example.com"></div>
    <div class="form-group"><label>Mobile Number</label><input type="tel" id="s-phone" placeholder="e.g. 98765 43210"></div>
    <div class="form-group"><label>Current Grade/Class</label>
      <select id="s-class">
        <option value="">Select Grade</option>
        <option value="Class 8 - 10">Class 8 - 10</option>
        <option value="Class 11 - 12">Class 11 - 12</option>
        <option value="Undergraduate">Undergraduate</option>
        <option value="Postgraduate">Postgraduate</option>
      </select>
    </div>
    <button class="btn" onclick="startTest()">Start Assessment →</button>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz-screen" class="screen">
  <div class="quiz-wrap">
    <div class="quiz-top">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52"/></svg>
        <div class="ring-num" id="ring-num">0%</div>
      </div>
      <div class="quiz-meta">
        <div class="t">Multi-Dimensional Test</div>
        <div class="p" id="prog-text">0 / 60 answered</div>
      </div>
      <div class="stage-pill" id="grade-pill"></div>
    </div>
    <div id="quiz-body"></div>
    <div class="quiz-nav">
      <button class="ghost-btn" id="back-btn" onclick="goBack()">← Back</button>
      <div></div>
    </div>
  </div>
</section>

<!-- REPORT -->
<section id="report-screen" class="screen">
  <div class="report-container" id="report-content"></div>
  <div style="max-width:1000px"><button class="print-btn" onclick="window.print()">Print / Save as PDF Document</button></div>
</section>
</main>

<script>
const sectionOptions = {

"Investigative": ["Research Scientist", "Doctor", "Data Analyst", "Psychologist", "Biotechnologist"],
"Artistic": ["Graphic Designer", "Filmmaker", "Writer/Author", "Architect", "Multimedia Artist"],
"Enterprising": ["Entrepreneur", "Marketing Manager", "Product Manager", "Sales Leader", "Investment Banker"],
"Social": ["Teacher", "Doctor", "Counselor", "HR Manager", "Social Worker"],
"Conventional": ["Chartered Accountant", "Auditor", "Banker", "Operations Manager", "Data Administrator"],
"Realistic": ["Engineer", "Agriculturist", "Defense Services", "Environmental Scientist"]
};

/* ---------- STATE ---------- */
let questions = [], answers = [], studentData = {};
let currentQ = 0, advancing = false, radarRef = null;
const CIRC = 2 * Math.PI * 52;

/* ---------- WELCOME ---------- */
function startTest() {
  const name = document.getElementById('s-name').value.trim();
  const email = document.getElementById('s-email').value.trim();
  const phone = document.getElementById('s-phone').value.trim();
  const sclass = document.getElementById('s-class').value;
  if(!name) { alert("Please enter your Name"); return; }
  if(!email) { alert("Please enter your Email"); return; }
  if(!phone) { alert("Please enter your Mobile Number"); return; }
  if(!sclass) { alert("Please select your Current Grade/Class"); return; }
  studentData = { name, email, phone, sclass };
  questions = questionBank[sclass];
  answers = new Array(questions.length).fill(null);
  currentQ = 0;
  document.getElementById('grade-pill').textContent = sclass;
  document.getElementById('form-screen').classList.remove('active');
  document.getElementById('quiz-screen').classList.add('active');
  renderQuestion();
  window.scrollTo(0, 0);
}

/* ---------- QUIZ ---------- */
function renderQuestion() {
  updateRing();
  document.getElementById('back-btn').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
  const body = document.getElementById('quiz-body');

  if(currentQ >= questions.length) {
    body.innerHTML = `<div class="done-card glass">
      <div class="done-emoji">🎉</div>
      <h2>All Done, ${studentData.name}!</h2>
      <p>You completed all ${questions.length} questions of the assessment.</p>
      <button class="btn" onclick="generateReport()">Generate My Full Report ✨</button>
    </div>`;
    return;
  }

  const q = questions[currentQ];
  let opts = '';
  sectionOptions[q.sec].forEach((label, idx) => {
    const sel = answers[currentQ] === idx + 1 ? ' selected' : '';
    opts += `<button type="button" class="opt-row${sel}" onclick="chooseOption(${idx})"><span class="opt-badge">${idx+1}</span><span>${label}</span></button>`;
  });
  body.innerHTML = `<div class="q-card-big glass">
    <div class="q-meta"><span class="q-sec">${q.sec}</span><span class="q-count">Question ${currentQ+1} of ${questions.length}</span></div>
    <div class="q-big">${q.t}</div>
    <div class="opts-list">${opts}</div>
    <div class="kbd-hint">💡 Tip: press keys <b>1–5</b> to answer faster · ← to go back</div>
  </div>`;
}

function chooseOption(idx) {
  if(advancing || currentQ >= questions.length) return;
  advancing = true;
  answers[currentQ] = idx + 1;
  document.querySelectorAll('#quiz-body .opt-row').forEach((r, i) => r.classList.toggle('selected', i === idx));
  updateRing();
  setTimeout(() => { advancing = false; currentQ++; renderQuestion(); if(currentQ >= questions.length) window.scrollTo({top:0, behavior:'smooth'}); }, 320);
}

function goBack() {
  if(advancing || currentQ === 0) return;
  currentQ--;
  renderQuestion();
}

function updateRing() {
  const answered = answers.filter(a => a !== null).length;
  const pct = questions.length ? answered / questions.length : 0;
  document.getElementById('ring-fill').style.strokeDashoffset = (CIRC * (1 - pct)).toFixed(1);
  document.getElementById('ring-num').textContent = Math.round(pct * 100) + '%';
  document.getElementById('prog-text').textContent = answered + ' / ' + questions.length + ' answered';
}

document.addEventListener('keydown', e => {
  if(!document.getElementById('quiz-screen').classList.contains('active')) return;
  if(e.key >= '1' && e.key <= '5') chooseOption(parseInt(e.key) - 1);
  else if(e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); goBack(); }
});

/* ---------- HELPERS ---------- */
function animateCount(el) {
  const target = +el.dataset.target, dur = 1300, t0 = performance.now();
  function step(t) {
    const p = Math.min((t - t0) / dur, 1), eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased) + '%';
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function setupReveals() {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll('#report-content .reveal').forEach(el => io.observe(el));
}
function initRadar(dims) {
  if(typeof Chart === 'undefined') return;
  const ctx = document.getElementById('radarChart'); if(!ctx) return;
  if(radarRef) radarRef.destroy();
  radarRef = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['Natural Abilities', 'Interests', 'Personality', 'Career Motivators', 'Learning Styles'],
      datasets: [{
        data: dims,
        fill: true,
        backgroundColor: 'rgba(37,99,235,0.28)',
        borderColor: '#1D4ED8',
        borderWidth: 2.5,
        pointBackgroundColor: '#1D4ED8',
        pointBorderColor: '#1D4ED8',
        pointRadius: 5,
        pointHoverRadius: 6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { r: {
        min: 0, max: 100,
        ticks: { stepSize: 20, backdropColor: 'transparent', color: '#475569', font: { size: 11, weight: '600' } },
        grid: { color: '#AEBBD0' },
        angleLines: { color: '#AEBBD0' },
        pointLabels: { color: '#0F172A', font: { family: 'Poppins', weight: '700', size: 12 } }
      }},
      plugins: { legend: { display: false } }
    }
  });
}

/* ---------- REPORT ---------- */
function generateReport() {
  const scores = {};
  questions.forEach((q, i) => {
    if(!scores[q.c]) scores[q.c] = { total: 0, count: 0 };
    if(answers[i]) { scores[q.c].total += answers[i]; scores[q.c].count++; }
  });
  for(let cat in scores) scores[cat].pct = Math.round((scores[cat].total / (scores[cat].count * 5)) * 100);

  function getLevel(p) {
    if(p >= 70) return '<span class="level-badge l-high">Dominant</span>';
    if(p >= 45) return '<span class="level-badge l-med">Moderate</span>';
    return '<span class="level-badge l-low">Emerging</span>';
  }
  const barFills = ['fill-1','fill-2','fill-3','fill-4'];
  const sectionOrder = ["Natural Abilities","Interests","Personality","Career Motivators","Learning Styles"];
  const sections = {};
  questions.forEach(q => {
    if(!sections[q.sec]) sections[q.sec] = [];
    if(!sections[q.sec].includes(q.c)) sections[q.sec].push(q.c);
  });
  const dims = sectionOrder.map(sec => {
    const cats = sections[sec] || []; if(!cats.length) return 0;
    return Math.round(cats.reduce((s,c) => s + scores[c].pct, 0) / cats.length);
  });

  const today = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  let html = '', pageNum = 1;

  html += `<div class="report-page cover-page page-break">
    <div class="cover-header"><div class="cover-logo">Multi-Dimensional Career Assessment</div><div class="page-num">Confidential Report</div></div>
    <div class="cover-main">
      <h1>Personal Career<br>Profile Report</h1>
      <p>A complete psychometric evaluation of ${studentData.name} across five dimensions — with personalised interpretations and career recommendations.</p>
      <div class="radar-box reveal"><canvas id="radarChart"></canvas></div>
    </div>
    <div class="cover-footer">
      <div>Candidate Name<span>${studentData.name}</span></div>
      <div>Grade / Stage<span>${studentData.sclass}</span></div>
      <div>Assessment Date<span>${today}</span></div>
      <div>Questions Completed<span>${questions.length} of ${questions.length}</span></div>
    </div>
  </div>`;
  pageNum++;

  sectionOrder.forEach(secName => {
    if(!sections[secName]) return;
    const cats = sections[secName];
    html += `<div class="report-page page-break">
      <div class="page-header"><div class="page-title">${secName}</div><div class="page-num">Page ${pageNum}</div></div>
      <div class="report-section">
        <h2>Score Overview</h2>
        <div class="bar-chart-box">`;
    cats.forEach((c, idx) => {
      html += `<div class="bar-item reveal"><div class="bar-label"><span>${c}</span><span class="pct-num" data-target="${scores[c].pct}">0%</span></div>
        <div class="bar-track"><div class="bar-fill ${barFills[idx % 4]}" data-w="${scores[c].pct}"></div></div></div>`;
    });
    html += `</div><h2>Detailed Breakdown</h2>
      <table class="table-custom reveal"><thead><tr><th>Category</th><th>Score</th><th>Level</th><th>Interpretation</th></tr></thead>`;
    cats.forEach(c => {
      html += `<tr><td class="cat">${c}</td><td>${scores[c].pct}%</td><td>${getLevel(scores[c].pct)}</td><td>${interpretations[c] ? interpretations[c].meaning : ''}</td></tr>`;
    });
    html += `</table><h2>Actionable Guidance</h2><ul class="reveal">`;
    cats.forEach(c => { (interpretations[c] ? interpretations[c].tips : []).forEach(t => { html += `<li><strong>${c}:</strong> ${t}</li>`; }); });
    html += `</ul></div></div>`;
    pageNum++;
  });

  const topAbilities = (sections["Natural Abilities"] || []).slice().sort((a,b) => scores[b].pct - scores[a].pct).slice(0,3);
  const topInterests = (sections["Interests"] || []).slice().sort((a,b) => scores[b].pct - scores[a].pct).slice(0,3);
  const topMotivator = (sections["Career Motivators"] || []).slice().sort((a,b) => scores[b].pct - scores[a].pct)[0];
  const topLearning  = (sections["Learning Styles"]   || []).slice().sort((a,b) => scores[b].pct - scores[a].pct)[0];

  html += `<div class="report-page page-break">
    <div class="page-header"><div class="page-title">Career Direction & Action Plan</div><div class="page-num">Page ${pageNum}</div></div>
    <div class="report-section">
      <h2>Your Signature Strengths</h2>
      <div class="summary-box reveal"><p><strong>${studentData.name}</strong>'s profile is anchored by <strong>${topAbilities.map(c => c + ' (' + scores[c].pct + '%)').join(', ')}</strong>, combined with genuine interest in <strong>${topInterests.slice(0,2).map(c => c + ' (' + scores[c].pct + '%)').join(' and ')}</strong>. Careers where these strengths and interests align will feel the most motivating and sustainable.</p></div>
      <h2>Primary Career Motivator</h2>
      <p class="reveal"><strong>${topMotivator}</strong> emerged as the strongest driver. ${interpretations[topMotivator] ? interpretations[topMotivator].meaning : ''}</p>
      <h2>Career Fields That Fit This Profile</h2>
      <table class="table-custom reveal"><thead><tr><th>Strength / Interest</th><th>Careers Worth Exploring</th></tr></thead>`;
  topAbilities.concat(topInterests).forEach(c => {
    html += `<tr><td class="cat">${c}</td><td>${(careerMap[c] || []).join(', ')}</td></tr>`;
  });
  html += `</table>
      <h2>Best Way to Study & Prepare</h2>
      <p class="reveal"><strong>${topLearning}</strong> is the dominant learning style. ${interpretations[topLearning] ? interpretations[topLearning].meaning : ''}</p>
      <ul class="reveal">${(interpretations[topLearning] ? interpretations[topLearning].tips : []).map(t => `<li>${t}</li>`).join('')}</ul>
      <h2>Recommended Next Steps</h2>
      <ul class="reveal">
        <li>Shortlist 2–3 career fields from the table above and research the required subjects and entrance paths.</li>
        <li>Speak to a teacher, counsellor, or professional working in those fields.</li>
        <li>Take one small action this month — an online course, a project, or a shadowing day.</li>
        <li>Revisit this report after 6 months; interests evolve with exposure.</li>
      </ul>
    </div>
  </div>`;

  document.getElementById('report-content').innerHTML = html;
  document.getElementById('quiz-screen').classList.remove('active');
  document.getElementById('report-screen').classList.add('active');
  window.scrollTo(0, 0);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('#report-content .bar-fill').forEach(b => b.style.width = b.dataset.w + '%');
    document.querySelectorAll('#report-content .pct-num').forEach(el => animateCount(el));
  }));
  initRadar(dims);
  setupReveals();

  if(typeof confetti === 'function') {
    const colors = ['#2563EB','#0EA5E9','#10B981','#F59E0B'];
    confetti({ particleCount: 130, spread: 75, origin: { y: 0.6 }, colors });
    setTimeout(() => confetti({ particleCount: 80, spread: 100, origin: { x: 0.2, y: 0.5 }, colors }), 260);
    setTimeout(() => confetti({ particleCount: 80, spread: 100, origin: { x: 0.8, y: 0.5 }, colors }), 460);
  }
}

/* Keep radar chart crisp when printing */
window.addEventListener('beforeprint', () => {
  if (radarRef) { radarRef.resize(); radarRef.update('none'); }
});
</script>
</body>
</html>
